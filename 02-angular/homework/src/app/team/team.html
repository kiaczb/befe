<div class="container">
    <div class="row">
        <div class="col-md-4" *ngFor="let employee of employees">
            <div class="card">
                <img src="{{ employee.imageUrl }}" class="card-img-top" alt="...">
                <div class="card-body">
                    <h5 class="card-title">{{ employee.name }}</h5>
                    <p class="card-text">{{ employee.position }}</p>
                    <a href="mailto:{{ employee.email }}" class="btn btn-primary">{{ employee.email}}</a>
                </div>
            </div>
        </div>
    </div>
</div>
